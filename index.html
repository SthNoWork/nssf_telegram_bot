<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSSF Facilities & Termination Map 🇰🇭</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link href="https://fonts.googleapis.com/css2?family=Content:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Content', sans-serif; background: #0e1621; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    header { background: #17212b; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #232e3c; flex-wrap: wrap; gap: 10px; z-index: 1000; }
    header h1 { font-size: 1.1rem; color: #2ea6ff; display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search-input { background: #0e1621; border: 1px solid #232e3c; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; outline: none; width: 220px; transition: 0.2s; }
    .search-input:focus { border-color: #2ea6ff; width: 260px; }
    .filter-btn { background: #0e1621; border: 1px solid #232e3c; color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; transition: 0.2s; }
    .filter-btn.active { background: #2ea6ff; border-color: #2ea6ff; color: #fff; font-weight: 600; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .badge-active { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
    .badge-term { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
    .user-banner { background: #2ea6ff; color: #fff; padding: 7px 16px; font-size: 0.84rem; font-weight: 600; text-align: center; display: none; }
    #map { flex: 1; width: 100%; height: 100%; }

    /* Noticeable Pulsating Beacon for User Location */
    .pulsing-beacon { position: relative; width: 28px; height: 28px; }
    .beacon-dot {
      width: 18px; height: 18px; background: #0088ff; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 0 12px rgba(0, 136, 255, 0.9);
      position: absolute; top: 5px; left: 5px; z-index: 2;
    }
    .beacon-pulse {
      width: 52px; height: 52px; background: rgba(0, 136, 255, 0.5);
      border-radius: 50%; position: absolute; top: -12px; left: -12px;
      animation: radar-pulse 2s infinite ease-out; z-index: 1;
    }
    @keyframes radar-pulse {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    .user-tooltip {
      background: #0088ff !important; color: #fff !important; font-weight: bold !important;
      font-size: 0.82rem !important; border: none !important; border-radius: 6px !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4) !important; padding: 4px 8px !important;
    }
    .user-tooltip::before { border-top-color: #0088ff !important; }

    /* Floating Update My Location Button */
    .btn-my-loc {
      position: absolute; bottom: 30px; right: 20px; z-index: 1000;
      background: #17212b; border: 2px solid #2ea6ff; color: #fff;
      padding: 10px 18px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: 0.2s;
    }
    .btn-my-loc:hover { background: #2ea6ff; color: #fff; transform: translateY(-2px); }

    .custom-popup .leaflet-popup-content-wrapper { background: #17212b; color: #fff; border-radius: 10px; border: 1px solid #232e3c; }
    .custom-popup .leaflet-popup-tip { background: #17212b; }
    .popup-title { font-size: 1rem; font-weight: bold; margin-bottom: 5px; color: #2ea6ff; }
    .popup-meta { font-size: 0.85rem; color: #a4b0be; line-height: 1.5; }
    .term-box { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; padding: 8px; border-radius: 6px; margin-top: 8px; font-size: 0.82rem; color: #ff6b6b; }
    .term-box a { color: #2ea6ff; text-decoration: underline; }
    .btn-nav { display: inline-block; margin-top: 8px; padding: 6px 12px; background: #2ea6ff; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.82rem; font-weight: 600; }

    @media (min-width: 900px) {
      header { padding: 14px 28px; }
      header h1 { font-size: 1.25rem; }
      .search-input { width: 300px; font-size: 0.95rem; }
      .search-input:focus { width: 360px; }
      .filter-btn { padding: 8px 16px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div id="user-banner" class="user-banner">📍 បង្ហាញគ្លីនិកជិតទីតាំងរបស់អ្នក / Showing partner clinics near your location</div>
  <header>
    <h1>🏥 NSSF Partner Facilities 🇰🇭</h1>
    <div class="controls">
      <input type="text" id="search" class="search-input" placeholder="🔍 Search clinic / district..." />
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active Only</button>
      <button class="filter-btn" data-filter="term">Terminated Only</button>
      <span class="badge badge-active" id="active-count">0 Active</span>
      <span class="badge badge-term" id="term-count">0 Terminated</span>
    </div>
  </header>
  <div id="map"></div>

  <!-- Floating Button to Update/Detect Live Location in Browser -->
  <button id="btn-update-loc" class="btn-my-loc">
    🎯 ធ្វើបច្ចុប្បន្នភាពទីតាំង (Update My Location)
  </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    // 1. Read URL Parameters for Location (from Telegram)
    const urlParams = new URLSearchParams(window.location.search);
    let userLat = parseFloat(urlParams.get('lat'));
    let userLng = parseFloat(urlParams.get('lng'));
    let hasUserLoc = !isNaN(userLat) && !isNaN(userLng);

    const defaultCenter = hasUserLoc ? [userLat, userLng] : [11.5564, 104.9282];
    const defaultZoom = hasUserLoc ? 14 : 8;

    const map = L.map('map').setView(defaultCenter, defaultZoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let userMarker = null;

    function renderUserLocation(lat, lng) {
      userLat = lat;
      userLng = lng;
      hasUserLoc = true;

      document.getElementById('user-banner').style.display = 'block';

      if (userMarker) {
        map.removeLayer(userMarker);
      }

      const beaconIcon = L.divIcon({
        className: 'pulsing-beacon',
        html: '<div class="beacon-pulse"></div><div class="beacon-dot"></div>',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      userMarker = L.marker([lat, lng], { icon: beaconIcon, zIndexOffset: 2000 }).addTo(map);
      userMarker.bindTooltip("📍 អ្នកនៅទីនេះ (YOU ARE HERE)", {
        permanent: true,
        direction: "top",
        offset: [0, -14],
        className: "user-tooltip"
      }).openTooltip();

      userMarker.bindPopup(`
        <div class="custom-popup">
          <div class="popup-title" style="color: #2ea6ff;">📍 ទីតាំងរបស់អ្នក / Your Location</div>
          <div class="popup-meta">កូអរដោនេ៖ ${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
        </div>
      `);

      map.flyTo([lat, lng], 14, { animate: true, duration: 1.2 });
      refreshClinicPopups();
    }

    if (hasUserLoc) {
      renderUserLocation(userLat, userLng);
    } else if (navigator.geolocation) {
      // Prompt user for location immediately on website load
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          renderUserLocation(pos.coords.latitude, pos.coords.longitude);
        },
        function(err) {
          console.warn('Geolocation permission not granted or unavailable:', err);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // Live update button handler
    document.getElementById('btn-update-loc').addEventListener('click', function() {
      const btn = this;
      btn.innerText = '⏳ កំពុងកំណត់ទីតាំង...';
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        btn.innerHTML = '🎯 ធ្វើបច្ចុប្បន្នភាពទីតាំង (Update My Location)';
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          renderUserLocation(pos.coords.latitude, pos.coords.longitude);
          btn.innerHTML = '✅ បានធ្វើបច្ចុប្បន្នភាព (Updated)';
          setTimeout(() => {
            btn.innerHTML = '🎯 ធ្វើបច្ចុប្បន្នភាពទីតាំង (Update My Location)';
          }, 3000);
        },
        function(err) {
          alert('Could not retrieve location: ' + err.message);
          btn.innerHTML = '🎯 ធ្វើបច្ចុប្បន្នភាពទីតាំង (Update My Location)';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    const greenIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const redIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const markersCluster = L.markerClusterGroup();
    let allMarkers = [];
    let currentFilter = 'all';

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371.0;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function checkTermination(nameKm, nameEn, terminations) {
      const coreKm = nameKm.replace(/មន្ទីរពហុព្យាបាល|មន្ទីរសម្រាកព្យាបាល|មន្ទីរពេទ្យ/g, '').trim();
      const coreEn = nameEn.replace(/Hospital|Clinic|Polyclinic|Referral/gi, '').trim();
      for (const item of terminations) {
        const text = item.text || '';
        if (coreKm.length > 2 && text.includes(coreKm)) return item;
        if (coreEn.length > 3 && text.toLowerCase().includes(coreEn.toLowerCase())) return item;
      }
      return null;
    }

    function refreshClinicPopups() {
      allMarkers.forEach(m => {
        const p = m.featureData;
        let distText = '';
        if (hasUserLoc) {
          const dist = haversineKm(userLat, userLng, p.lat, p.lng);
          distText = ` (${dist.toFixed(1)} km ពីអ្នក)`;
        }

        let termHtml = '';
        if (p.isTerm && p.termNotice) {
          termHtml = `
            <div class="term-box">
              ⚠️ <strong>កិច្ចព្រមព្រៀងត្រូវបានបញ្ចប់/ផ្អាក!</strong><br>
              ថ្ងៃទី៖ ${p.termNotice.date ? p.termNotice.date.substring(0, 10) : 'N/A'}<br>
              ${p.termNotice.url ? `<a href="${p.termNotice.url}" target="_blank">🔗 មើលសេចក្តីជូនដំណឹងផ្លូវការ</a>` : ''}
            </div>
          `;
        }

        const popupContent = `
          <div class="custom-popup">
            <div class="popup-title">${p.nameKm}</div>
            <div class="popup-meta">
              <div><strong>EN:</strong> ${p.nameEn}</div>
              <div><strong>📍 ទីតាំង៖</strong> ${p.district}, ${p.province}${distText}</div>
              <div><strong>📞 ទូរស័ព្ទ៖</strong> ${p.phone}</div>
              ${termHtml}
              <a class="btn-nav" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">🗺 បើកមើលផ្លូវ (Google Maps)</a>
            </div>
          </div>
        `;
        m.bindPopup(popupContent);
      });
    }

    async function loadData() {
      let geojson = null;
      let terminations = [];

      try {
        const termRes = await fetch('verified_terminations.json');
        if (termRes.ok) terminations = await termRes.json();
      } catch (e) {
        console.warn('Could not load verified_terminations.json', e);
      }

      const paths = ['telegram_bot/data/nssf.geojson', 'data/nssf.geojson', 'telegram_bot/data/nssf.json'];
      for (const p of paths) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            geojson = await res.json();
            break;
          }
        } catch (e) {}
      }

      if (!geojson || !geojson.features) {
        alert('Could not load GeoJSON dataset. Please ensure nssf.geojson is available.');
        return;
      }

      let activeCount = 0;
      let termCount = 0;

      geojson.features.forEach(f => {
        const p = f.properties || {};
        const lat = parseFloat(p.lat);
        const lng = parseFloat(p.long || p.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        const nameEn = p.name || p.name_en || 'NSSF Partner Facility';
        const nameKm = p.name_km || nameEn;
        const phone = (p.contact || p.ambulance || p.nssf_agency || p.phone || 'N/A').split('\n')[0].trim();
        const district = p.district || 'N/A';
        const province = p.province || 'Cambodia';

        const termNotice = checkTermination(nameKm, nameEn, terminations);
        const isTerm = termNotice !== null;

        if (isTerm) termCount++; else activeCount++;

        const icon = isTerm ? redIcon : greenIcon;
        const marker = L.marker([lat, lng], { icon });

        marker.featureData = {
          nameKm,
          nameEn,
          district,
          province,
          phone,
          lat,
          lng,
          isTerm,
          termNotice,
        };

        markersCluster.addLayer(marker);
        allMarkers.push(marker);
      });

      map.addLayer(markersCluster);
      document.getElementById('active-count').innerText = `${activeCount} Active`;
      document.getElementById('term-count').innerText = `${termCount} Terminated`;
      refreshClinicPopups();
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      markersCluster.clearLayers();

      allMarkers.forEach(m => {
        const d = m.featureData;
        const matchesQuery = !q || (
          d.nameKm.toLowerCase().includes(q) ||
          d.nameEn.toLowerCase().includes(q) ||
          d.district.toLowerCase().includes(q) ||
          d.province.toLowerCase().includes(q)
        );

        let matchesStatus = true;
        if (currentFilter === 'active') matchesStatus = !d.isTerm;
        if (currentFilter === 'term') matchesStatus = d.isTerm;

        if (matchesQuery && matchesStatus) {
          markersCluster.addLayer(m);
        }
      });

      if (!map.hasLayer(markersCluster)) {
        map.addLayer(markersCluster);
      }
    }

    document.getElementById('search').addEventListener('input', applyFilters);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        applyFilters();
      });
    });

    loadData();
  </script>
</body>
</html>
